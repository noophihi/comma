<!-- Google Fonts 추가 (볼드 폰트 적용용) -->
<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  /* =========================================
     5파트 : CONTACT (명함 영역)
  ========================================= */
  .contact-section {
    background-color: #b9d7f9; /* 배경 하늘색 */
    padding: 40px 20px 50px;
    font-family: 'Noto Sans KR', sans-serif;
  }

  /* 상단 헤더 (CONTACT + 우산) */
  .contact-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }

  .contact-title {
    font-family: 'Gasoek One', sans-serif;
    font-size: 42px;
    color: #0b5093;
    line-height: 1;
    letter-spacing: -0.5px;
  }

  /* 우산 이미지 (이미지 파일이 있다면 img 태그로 교체 가능) */
  .umbrella-icon {
    width: 45px;
    height: 45px;
    object-fit: contain;
  }

  .contact-sub {
    font-size: 13px;
    font-weight: 700;
    color: #2b303a;
    margin-bottom: 25px;
  }

  /* 명함 카운터 카드 */
  .card-container {
    position: relative;
    background: #ffffff;
    box-shadow: 6px 6px 0px #8faed3; /* 명함 그림자 */
    border-radius: 2px;
    overflow: hidden;
  }

  /* 명함 상단 5단계 컬러바 */
  .color-bar {
    display: flex;
    height: 12px;
    width: 100%;
  }

  .color-bar span { flex: 1; }
  .cb-1 { background-color: #d2e4f7; }
  .cb-2 { background-color: #a4caf0; }
  .cb-3 { background-color: #5193d5; }
  .cb-4 { background-color: #2b6cb0; }
  .cb-5 { background-color: #173867; }

  /* 명함 본문 */
  .card-content {
    display: flex;
    align-items: center;
    padding: 25px 20px;
    gap: 20px;
  }

  /* 명함 왼쪽 : 로고 */
  .card-logo {
    width: 90px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card-logo img {
    width: 100%;
    height: auto;
  }

  /* 명함 오른쪽 : 정보 */
  .card-info {
    flex: 1;
  }

  .name-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }

  .name {
    font-size: 20px;
    font-weight: 900;
    color: #111111;
  }

  .role {
    font-size: 10px;
    font-weight: 700;
    color: #555555;
  }

  .info-list {
    font-size: 11px;
    line-height: 1.7;
    color: #222222;
  }

  .info-item {
    display: flex;
  }

  .info-label {
    width: 58px;
    font-weight: 700;
    color: #0b5093; /* 파란색 라벨 */
  }

  .info-val {
    font-weight: 500;
  }
</style>


<!-- ================= SECTION 5 HTML ================= -->
<section class="contact-section">

    </div>
  </div>

</section>
