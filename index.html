<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JMEDI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #e8f1fb;
    color: #17243a;
    font-family: 'Gowun Dodum', sans-serif;
}

.page {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    background: #f9fbff;
    overflow: hidden;
}

/* --------------------
   TOP
-------------------- */

.hero {
    min-height: 360px;
    background: #a9c8ed;
    padding: 26px 22px 35px;
    position: relative;
    overflow: hidden;
}

.top-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 1px;
}

.logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 27px;
    letter-spacing: -2px;
}

.number {
    font-size: 11px;
    font-weight: bold;
}

.hero-title {
    margin-top: 75px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 65px;
    line-height: .85;
    letter-spacing: -4px;
}

.hero-title .outline {
    color: transparent;
    -webkit-text-stroke: 1.5px #17243a;
}

.intro {
    position: absolute;
    bottom: 28px;
    left: 23px;
    font-size: 13px;
    line-height: 1.7;
}

/* --------------------
   CATALOG
-------------------- */

.catalog {
    padding: 55px 22px 70px;
    position: relative;
}

.section-label {
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

.catalog-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 64px;
    letter-spacing: -3px;
    line-height: .9;
}

.catalog-title span {
    color: transparent;
    -webkit-text-stroke: 1.5px #4d8ed9;
}

.catalog-sub {
    margin-top: 17px;
    font-size: 12px;
}

.catalog-wrap {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    position: relative;
}

.catalog-card {
    width: 67%;
    padding: 9px;
    background: white;
    box-shadow: 12px 14px 0 #9fc2ea;
    transform: rotate(-2deg);
    cursor: pointer;
}

.catalog-card img {
    width: 100%;
    display: block;
}

/* 작은 장식 */

.catalog-note {
    position: absolute;
    right: 8px;
    bottom: 5px;
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    transform: rotate(8deg);
}

/* --------------------
   LINKS
-------------------- */

.links {
    background: #d4e7f9;
    padding: 55px 22px 65px;
}

.links-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 43px;
    letter-spacing: -2px;
}

.links-title span {
    color: transparent;
    -webkit-text-stroke: 1px #17243a;
}

.link-list {
    margin-top: 35px;
}

.link-item {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 21px 3px;

    border-top: 1px solid #6e91b7;

    text-decoration: none;
    color: #17243a;
}

.link-item:last-child {
    border-bottom: 1px solid #6e91b7;
}

.link-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 27px;
}

.link-desc {
    font-size: 10px;
}

.arrow {
    font-size: 24px;
}

/* --------------------
   BUSINESS CARD
-------------------- */

.card-section {
    background: #f9fbff;
    padding: 65px 22px 80px;
    position: relative;
}

.card-label {
    font-size: 10px;
    letter-spacing: 2px;
}

.card-title {
    margin-top: 8px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 45px;
    letter-spacing: -2px;
}

.business-card {
    margin-top: 30px;
    min-height: 210px;
    background: #a9c8ed;
    padding: 25px;
    position: relative;
    overflow: hidden;
}

.business-card::after {
    content: "JMEDI";
    position: absolute;
    right: -25px;
    bottom: -35px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 95px;
    color: rgba(255,255,255,.28);
}

.business-card h3 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 28px;
}

.business-card p {
    margin-top: 20px;
    font-size: 12px;
    line-height: 2;
}

/* --------------------
   FOOTER
-------------------- */

.footer {
    background: #17243a;
    color: white;
    padding: 35px 22px;
    font-size: 10px;
    line-height: 1.8;
}

.footer strong {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
}

</style>
</head>


<body>

<div class="page">

    <!-- TOP -->

    <section class="hero">

        <div class="top-line">
            <div class="logo">JMEDI</div>
            <div class="number">SINCE 1985</div>
        </div>

        <div class="hero-title">
            J<span class="outline">MEDI</span>
        </div>

        <div class="intro">
            안녕하세요!<br>
            의약품 도매상 <strong>제이메디</strong> 입니다.
        </div>

    </section>


    <!-- CATALOG -->

    <section class="catalog">

        <div class="section-label">
            JMEDI / 2026
        </div>

        <div class="catalog-title">
            CATA<span>LOG</span>
        </div>

        <div class="catalog-sub">
            2026 제이메디 카달로그 입니다.
        </div>

        <div class="catalog-wrap">

            <a href="catalog.pdf" class="catalog-card">
                <img src="catalog.pdf" alt="2026 제이메디 카달로그">
            </a>

            <div class="catalog-note">
                CLICK →
            </div>

        </div>

    </section>


    <!-- LINKS -->

    <section class="links">

        <div class="links-title">
            GO <span>TO</span>
        </div>

        <div class="link-list">

            <a href="https://blog.naver.com/green__comma"
               class="link-item">

                <div>
                    <div class="link-name">BLOG</div>
                    <div class="link-desc">제이메디 블로그 바로가기</div>
                </div>

                <div class="arrow">↗</div>

            </a>


            <a href="#" class="link-item">

                <div>
                    <div class="link-name">WEBSITE</div>
                    <div class="link-desc">제이메디 사이트 바로가기</div>
                </div>

                <div class="arrow">↗</div>

            </a>

        </div>

    </section>


    <!-- BUSINESS CARD -->

    <section class="card-section">

        <div class="card-label">
            CONTACT / DIGITAL CARD
        </div>

        <div class="card-title">
            CONTACT
        </div>

        <div class="business-card">

            <h3>JMEDI</h3>

            <p>
                의약품 도매상 제이메디<br>
                TEL. 010-5909-8573<br>
                E-MAIL. greencomma77@naver.com
            </p>

        </div>

    </section>


    <footer class="footer">

        <strong>JMEDI</strong><br>
        Pharmaceutical Wholesale

    </footer>

</div>

</body>
</html>
